<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Dev Internship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-shell login-shell">
    <section class="auth-visual d-none d-lg-flex">
      <div class="visual-content">
        <div class="brand-mark">DS</div>
        <p class="eyebrow">Secure Login</p>
        <h1>Continue to your editable profile.</h1>
        <p class="lead-text">The browser stores only a token in localStorage. Redis keeps the backend session state.</p>
        <div class="flow-strip" aria-label="Application flow">
          <span>Register</span>
          <span class="active">Login</span>
          <span>Profile</span>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="form-wrap compact">
        <div class="mobile-brand d-lg-none">
          <span class="brand-mark small">DS</span>
          <span>Developer Signup</span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="eyebrow mb-1">Login</p>
            <h2 class="page-title">Welcome back</h2>
          </div>
          <a class="soft-link pill-link" href="register.html">Register</a>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100 mt-2" type="submit">
            <span class="btn-label">Login</span>
            <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
          </button>
          <p class="form-note">Session token is stored in localStorage as required.</p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
