services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: internship_signup
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MONGO_URI: mongodb://mongo:27017
      REDIS_HOST: redis
    depends_on:
      - mysql
      - mongo
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: internship_signup
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
  mongo_data:
