<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Dev Internship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual d-none d-lg-flex">
      <div class="visual-content">
        <div class="brand-mark">DS</div>
        <p class="eyebrow">Developer Internship</p>
        <h1>Build your secure profile in one clean flow.</h1>
        <p class="lead-text">Register once, sign in with AJAX, and manage profile details through a Redis-backed login token.</p>
        <div class="flow-strip" aria-label="Application flow">
          <span class="active">Register</span>
          <span>Login</span>
          <span>Profile</span>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="form-wrap">
        <div class="mobile-brand d-lg-none">
          <span class="brand-mark small">DS</span>
          <span>Developer Signup</span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="eyebrow mb-1">Register</p>
            <h2 class="page-title">Create account</h2>
          </div>
          <a class="soft-link pill-link" href="login.html">Login</a>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="firstName">First name</label>
              <input class="form-control" id="firstName" name="first_name" type="text" autocomplete="given-name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lastName">Last name</label>
              <input class="form-control" id="lastName" name="last_name" type="text" autocomplete="family-name" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="email">Email address</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="confirmPassword">Confirm password</label>
              <input class="form-control" id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" required>
            </div>
          </div>

          <button class="btn btn-primary w-100 mt-4" type="submit">
            <span class="btn-label">Create account</span>
            <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
          </button>
          <p class="form-note">AJAX powered signup with secure password hashing.</p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
